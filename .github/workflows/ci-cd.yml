# Pipeline CI/CD
#
#   lint ──┐
#          ├──> docker (deploiement de test sur le runner) ──> deploy-test        (push sur develop)
#   tests ─┘                                              └──> deploy-production  (push sur main ou tag v*)
#
# Environnements :
#   dev        : poste du developpeur (.env local, uvicorn ou docker compose)
#   test       : CI (base PostgreSQL ephemere) puis environnement GitHub "test" a chaque fusion dans develop
#   production : environnement GitHub "production" a chaque fusion dans main et a chaque tag de version
# Les secrets (cle API, mots de passe) sont stockes dans les environnements GitHub, jamais dans le code.

name: CI/CD

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff==0.17.1
      - run: ruff check --output-format=github .

  tests:
    name: Tests (pytest + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          # base ephemere detruite a la fin du job : ces identifiants ne protegent rien
          POSTGRES_USER: technova_test
          POSTGRES_PASSWORD: technova_test
          POSTGRES_DB: technova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://technova_test:technova_test@localhost:5432/technova_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests et couverture
        run: >-
          pytest -p no:cacheprovider
          --cov --cov-report=term-missing --cov-report=xml --cov-report=html
          --junitxml=reports/junit.xml
      - name: Resume de la couverture
        if: always()
        run: |
          echo '### Couverture des tests' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          coverage report >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Rapport de couverture (HTML + XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests
          path: |
            htmlcov/
            coverage.xml
            reports/junit.xml

  docker:
    name: Deploiement Docker (test de fumee)
    needs: [lint, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Secrets ephemeres (generes pour ce job uniquement)
        run: |
          {
            echo "APP_ENV=test"
            echo "POSTGRES_ADMIN_PASSWORD=$(openssl rand -hex 16)"
            echo "POSTGRES_APP_PASSWORD=$(openssl rand -hex 16)"
            echo "API_KEY=$(openssl rand -hex 24)"
          } > .env
      - name: Demarrage (PostgreSQL + init + API)
        run: docker compose up -d --build
      - name: Test de fumee
        run: |
          set -a; . ./.env; set +a
          scripts/smoke_test.sh
      - name: Logs en cas d'echec
        if: failure()
        run: docker compose logs
      - name: Arret
        if: always()
        run: docker compose down -v

  deploy-test:
    name: Deploiement - test
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: test
    permissions:
      contents: read
      packages: write
    secrets: inherit

  deploy-production:
    name: Deploiement - production
    needs: docker
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
    permissions:
      contents: read
      packages: write
    secrets: inherit
