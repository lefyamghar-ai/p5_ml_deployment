# Deploiement dans un environnement GitHub (test ou production), appele par ci-cd.yml.
#
# 1. verifie que les secrets de l'environnement sont definis ;
# 2. deploie la pile complete (PostgreSQL + init + API) avec ces secrets et la verifie (test de fumee) ;
# 3. publie l'image validee sur GitHub Container Registry (ghcr.io).
#
# Secrets attendus dans chaque environnement (Settings > Environments) :
#   API_KEY, POSTGRES_ADMIN_PASSWORD, POSTGRES_APP_PASSWORD

name: Deploiement

on:
  workflow_call:
    inputs:
      environment:
        description: "test ou production"
        required: true
        type: string

jobs:
  deploy:
    name: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment }}
      url: https://github.com/${{ github.repository }}/pkgs/container/${{ github.event.repository.name }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Secrets de l'environnement ${{ inputs.environment }}
        env:
          API_KEY: ${{ secrets.API_KEY }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          POSTGRES_APP_PASSWORD: ${{ secrets.POSTGRES_APP_PASSWORD }}
        run: |
          for nom in API_KEY POSTGRES_ADMIN_PASSWORD POSTGRES_APP_PASSWORD; do
            if [ -z "${!nom}" ]; then
              echo "::error::Secret $nom absent de l'environnement ${{ inputs.environment }}"
              exit 1
            fi
          done
          {
            echo "APP_ENV=${{ inputs.environment == 'production' && 'prod' || 'test' }}"
            echo "API_KEY=$API_KEY"
            echo "POSTGRES_ADMIN_PASSWORD=$POSTGRES_ADMIN_PASSWORD"
            echo "POSTGRES_APP_PASSWORD=$POSTGRES_APP_PASSWORD"
          } > .env

      - name: Deploiement de la pile
        run: docker compose up -d --build

      - name: Test de fumee
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: scripts/smoke_test.sh

      - name: Logs en cas d'echec
        if: failure()
        run: docker compose logs

      - name: Arret
        if: always()
        run: docker compose down -v

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha

      - name: Publication sur ghcr.io
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
